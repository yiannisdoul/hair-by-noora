name = "cloudflare-api"
main = "src/index.js"
compatibility_date = "2024-03-07"

[vars]
DOMAIN = "http://localhost:5173"

[env.production]
name = "hair-by-noora-api-production"
[env.production.vars]
DOMAIN = "https://hairbynoora.com.au"
BREVO_FROM_EMAIL = "bookings@hairbynoora.com.au"
BREVO_FROM_NAME = "Hair by Noora"
BREVO_BCC_EMAIL = "bookings@hairbynoora.com.au"
TIMEZONE= "Australia/Melbourne"

# Use these values in your .dev.vars file
